<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body class="image">

    <main>
      <div>
        <span class="num1">
          <p class="intery1">
            Enter 1st Number.
            <input type="number" placeholder="00" class="fill" />
          </p>
        </span>

        <span class="num2">
          <p class="intery2">
            Enter 2nd number.
            <input type="number" placeholder="00" class="fill" />

        </span>
      </div>
      <br />

        <span>
          <button class="add">Addition</button>
        </span>
        <span>
          <button class="sub">Subtraction</button>
        </span>
        <span>
          <button class="multi">Multipication</button>
        </span>
        <span>
          <button class="divide">Division</button>
        </span>
      </div>
    </main>
    <br />
    <footer class="title">
      
        <h1 class="Result">Result =</h1>
      
    </footer>
